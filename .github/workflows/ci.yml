name: SDK CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Detect published sources
        id: sources
        shell: bash
        run: |
          if [[ -f gen/go/relay/communication/v1/sync.pb.go && -f Sources/RelayProtocol/relay/communication/v1/sync.pb.swift ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject incomplete release tags
        if: steps.sources.outputs.published != 'true' && github.ref_type == 'tag'
        run: |
          echo "Generated SDK sources are required for release tags." >&2
          exit 1
      - uses: actions/setup-go@v6
        if: steps.sources.outputs.published == 'true'
        with:
          go-version-file: go.mod
      - run: go test ./...
        if: steps.sources.outputs.published == 'true'
      - run: swift build
        if: steps.sources.outputs.published == 'true'

